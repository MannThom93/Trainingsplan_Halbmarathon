<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HM-Pro Coach v3.1</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">

    <!-- FIX #1: defer von Babel entfernt – sonst wird JSX nicht rechtzeitig transpiliert -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            margin: 0;
            /* FIX #7: overflow-y statt overflow – verhindert Keyboard-Probleme auf Mobile */
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            background: #ffffff;
            transition: all 0.2s ease;
            font-size: 16px;
            box-sizing: border-box;
        }
        .input-field:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-secondary {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-secondary:active { transform: scale(0.96); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideIn 0.3s ease-out forwards; }
        .progress-bar { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade { animation: fadeIn 0.2s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // FIX #2: Sicherer UUID-Fallback für HTTP/Datei-Kontext
        const safeUUID = () => {
            try {
                return crypto.randomUUID();
            } catch {
                return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
            }
        };

        // FIX #6: Sicheres localStorage mit try/catch
        const storage = {
            get: (key, fallback = null) => {
                try {
                    const v = localStorage.getItem(key);
                    return v ? JSON.parse(v) : fallback;
                } catch { return fallback; }
            },
            set: (key, value) => {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
            },
            remove: (key) => {
                try { localStorage.removeItem(key); } catch {}
            }
        };

        // --- WISSENSCHAFTLICHE ENGINE ---
        const Science = {
            calculateVDOT: (distMeter, timeMin) => {
                // FIX: Robustere Eingabevalidierung
                if (!Number.isFinite(distMeter) || !Number.isFinite(timeMin) || timeMin <= 0 || distMeter <= 0) return 30;
                const v = distMeter / timeMin;
                const t = timeMin;
                const drop = 0.8 + 0.1894393 * Math.exp(-0.0115 * t) + 0.2989558 * Math.exp(-0.193 * t);
                const o2cost = -4.6 + 0.182258 * v + 0.000104 * Math.pow(v, 2);
                return Math.min(Math.max(o2cost / drop, 30), 85);
            },
            getPaces: (vdot) => {
                const v = Number.isFinite(vdot) && vdot > 0 ? vdot : 30;
                return {
                    easy: (1 / ((v * 0.65) / 60) * 1.6).toFixed(2),
                    threshold: (1 / ((v * 0.88) / 60) * 1.15).toFixed(2),
                    interval: (1 / ((v * 0.97) / 60) * 1.05).toFixed(2)
                };
            },
            formatPace: (decimal) => {
                const d = parseFloat(decimal);
                if (!Number.isFinite(d) || d <= 0) return "--:--";
                const mins = Math.floor(d);
                const secs = Math.round((d - mins) * 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            },
            getCycleData: (lastStart, length) => {
                if (!lastStart) return null;
                const safeLength = Math.max(parseInt(length) || 28, 1);
                const today = new Date();
                const start = new Date(lastStart);
                if (isNaN(start.getTime())) return null;
                const diffDays = Math.ceil(Math.abs(today - start) / (1000 * 60 * 60 * 24));
                const currentDay = (diffDays % safeLength) || safeLength;
                if (currentDay <= 5) return { phase: "Menstruation", intensity: 0.8, color: "text-red-500", bg: "bg-red-50", icon: "fa-droplet", advice: "Schonendes Training empfohlen." };
                if (currentDay <= 13) return { phase: "Follikelphase", intensity: 1.1, color: "text-emerald-600", bg: "bg-emerald-50", icon: "fa-bolt", advice: "Maximale Belastbarkeit." };
                if (currentDay <= 16) return { phase: "Ovulation", intensity: 1.0, color: "text-purple-600", bg: "bg-purple-50", icon: "fa-sun", advice: "Energiehoch, Vorsicht bei Bändern." };
                return { phase: "Lutealphase", intensity: 0.85, color: "text-orange-500", bg: "bg-orange-50", icon: "fa-leaf", advice: "Fokus auf lockere Läufe." };
            },
            // FIX #5: Robustes Race-Time-Parsing mit Fallback für alle Formate
            parseRaceTime: (timeStr) => {
                if (!timeStr || typeof timeStr !== 'string') return 0;
                const parts = timeStr.trim().split(':').map(s => parseFloat(s));
                if (parts.some(isNaN)) return 0;
                if (parts.length === 3) return parts[0] * 60 + parts[1] + parts[2] / 60;
                if (parts.length === 2) return parts[0] + parts[1] / 60;
                if (parts.length === 1 && parts[0] > 0) return parts[0]; // Einzelne Zahl als Minuten
                return 0;
            },
            getHrZones: (maxHr, restHr) => {
                const max = parseFloat(maxHr);
                const rest = parseFloat(restHr);
                if (!Number.isFinite(max) || !Number.isFinite(rest) || max <= rest) return null;
                const hrr = max - rest;
                return {
                    easy: `${Math.round(rest + hrr * 0.60)}–${Math.round(rest + hrr * 0.70)} bpm`,
                    threshold: `${Math.round(rest + hrr * 0.85)}–${Math.round(rest + hrr * 0.90)} bpm`,
                    interval: `${Math.round(rest + hrr * 0.95)}–${Math.round(max)} bpm`
                };
            },
            // Prognose-Rechner: Zielzeit für beliebige Distanz auf Basis VDOT (Riegel-Formel)
            predictTime: (vdot, distKm) => {
                if (!Number.isFinite(vdot) || vdot <= 0 || !Number.isFinite(distKm) || distKm <= 0) return null;
                // Optimale Pace für Zieldistanz via VDOT-Iteration
                // Nutze Daniels-Formel umgekehrt: finde t so dass VDOT(dist, t) = vdot
                const distM = distKm * 1000;
                let lo = distKm * 1.5, hi = distKm * 15, mid;
                for (let i = 0; i < 60; i++) {
                    mid = (lo + hi) / 2;
                    const v = Science.calculateVDOT(distM, mid);
                    if (v > vdot) lo = mid; else hi = mid;
                }
                return mid; // Minuten
            },
            formatTime: (totalMinutes) => {
                if (!Number.isFinite(totalMinutes) || totalMinutes <= 0) return "--:--:--";
                const h = Math.floor(totalMinutes / 60);
                const m = Math.floor(totalMinutes % 60);
                const s = Math.round((totalMinutes * 60) % 60);
                if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                return `${m}:${s.toString().padStart(2,'0')}`;
            },
            // Taper-Logik: Wieviele Wochen bis Wettkampf, welche Trainingsphase?
            getTaperPhase: (raceDate) => {
                if (!raceDate) return null;
                const today = new Date();
                const race = new Date(raceDate);
                if (isNaN(race.getTime())) return null;
                const daysLeft = Math.ceil((race - today) / (1000 * 60 * 60 * 24));
                if (daysLeft < 0) return { type: 'past', daysLeft: 0, label: 'Wettkampf vorbei', factor: 1.0, color: 'text-slate-400', bg: 'bg-slate-50', icon: 'fa-flag-checkered', advice: 'Zeit für einen neuen Zielwettkampf!' };
                if (daysLeft <= 7) return { type: 'race-week', daysLeft, label: 'Wettkampfwoche!', factor: 0.5, color: 'text-red-600', bg: 'bg-red-50', icon: 'fa-rocket', advice: 'Nur noch lockere Läufe. Keine neuen Reize. Schlaf & Ernährung priorisieren.' };
                if (daysLeft <= 14) return { type: 'taper2', daysLeft, label: 'Taper Phase 2', factor: 0.65, color: 'text-orange-500', bg: 'bg-orange-50', icon: 'fa-battery-three-quarters', advice: 'Volumen stark reduzieren, 1–2 kurze Tempoläufe zur Aktivierung.' };
                if (daysLeft <= 21) return { type: 'taper1', daysLeft, label: 'Taper Phase 1', factor: 0.75, color: 'text-yellow-600', bg: 'bg-yellow-50', icon: 'fa-battery-half', advice: 'Volumen um 25% reduzieren, Intensität beibehalten.' };
                if (daysLeft <= 42) return { type: 'build', daysLeft, label: 'Aufbauphase', factor: 1.0, color: 'text-emerald-600', bg: 'bg-emerald-50', icon: 'fa-arrow-trend-up', advice: 'Vollgas. Trainingsvolumen aufbauen.' };
                return { type: 'base', daysLeft, label: 'Grundlagenphase', factor: 1.0, color: 'text-blue-600', bg: 'bg-blue-50', icon: 'fa-mountain', advice: 'Fokus auf Easy-Läufe und Grundlagenausdauer.' };
            },
            getPopulationPercentile: (vdot) => {
                if (vdot < 35) return { percent: 40, text: "Besser als 40% (Grundfitness)", color: "text-slate-500" };
                if (vdot < 42) return { percent: 65, text: "Top 35% (Guter Hobbyläufer)", color: "text-blue-500" };
                if (vdot < 50) return { percent: 85, text: "Top 15% (Ambitioniert)", color: "text-emerald-500" };
                if (vdot < 58) return { percent: 95, text: "Top 5% (Lokales Spitzenfeld)", color: "text-orange-500" };
                return { percent: 99, text: "Top 1% (Elite-Amateur)", color: "text-red-500" };
            }
        };

        // FIX #8: Notification mit Close-Button wiederhergestellt
        const Notification = ({ message, type = 'success', onClose }) => {
            if (!message) return null;
            return (
                <div className={`fixed bottom-24 left-1/2 -translate-x-1/2 ${type === 'error' ? 'bg-red-600' : 'bg-slate-900'} text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-[100] animate-slide w-[90%] max-w-sm`}>
                    <i className={`fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} flex-none`}></i>
                    <span className="font-bold text-sm flex-1 text-center">{message}</span>
                    <button onClick={onClose} className="opacity-60 hover:opacity-100 ml-1 flex-none"><i className="fas fa-times"></i></button>
                </div>
            );
        };

        const StatCard = ({ label, value, subValue, icon, color }) => (
            <div className="glass-card p-4 flex flex-col items-center justify-center text-center">
                <div className={`w-10 h-10 rounded-full ${color} flex items-center justify-center mb-2 text-white shadow-sm`}><i className={`fas ${icon}`}></i></div>
                <div className="text-xl font-black text-slate-800">{value}</div>
                {subValue && <div className="text-[9px] text-slate-400 font-bold uppercase">{subValue}</div>}
                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">{label}</div>
            </div>
        );

        const DEFAULT_PROFILE = {
            baseTime: 0,
            experience: "intermediate",
            cycleEnabled: false,
            lastPeriod: "",
            cycleLength: 28,
            age: "",
            weight: "",
            maxHr: "",
            restHr: "",
            assessmentCompleted: false,
            assessmentDistance: 5,
            assessmentTime: "",
            raceGoalDate: "",
            raceGoalName: "",
            raceGoalDist: 21.0975
        };

        function App() {
            const [isLoading, setIsLoading] = useState(true);
            const [notification, setNotification] = useState(null);
            const [activeTab, setActiveTab] = useState('plan');
            const [quickLogRun, setQuickLogRun] = useState(null);
            const [assessmentDist, setAssessmentDist] = useState(5);
            const [showPredictor, setShowPredictor] = useState(false);
            const fileInputRef = useRef(null);

            // FIX #6: Alle localStorage-Zugriffe über sicheres storage-Objekt
            const [profile, setProfile] = useState(() => ({
                ...DEFAULT_PROFILE,
                ...storage.get('mc_profile_v31', {})
            }));
            const [runs, setRuns] = useState(() => storage.get('mc_runs_v31', []));
            const [races, setRaces] = useState(() => storage.get('mc_races_v31', []));
            const [nextRunIdx, setNextRunIdx] = useState(() => storage.get('mc_next_run_idx_v31', 0));

            useEffect(() => {
                storage.set('mc_profile_v31', profile);
            }, [profile]);
            useEffect(() => {
                storage.set('mc_runs_v31', runs);
            }, [runs]);
            useEffect(() => {
                storage.set('mc_races_v31', races);
            }, [races]);
            useEffect(() => {
                storage.set('mc_next_run_idx_v31', nextRunIdx);
            }, [nextRunIdx]);

            useEffect(() => { setTimeout(() => setIsLoading(false), 400); }, []);

            const showNotify = useCallback((msg, type = 'success') => {
                setNotification({ message: msg, type });
                setTimeout(() => setNotification(null), 3500);
            }, []);

            // --- ADAPTIVE CALCULATIONS ---
            const adaptiveVDOT = useMemo(() => {
                if (!profile.assessmentCompleted) return 30;
                let bestVDOT = Science.calculateVDOT(
                    profile.assessmentDistance * 1000,
                    parseFloat(profile.assessmentTime)
                );
                runs.slice(0, 15).forEach(run => {
                    if (run.distance > 2) {
                        const v = Science.calculateVDOT(run.distance * 1000, run.duration);
                        if (v > bestVDOT) bestVDOT = v;
                    }
                });
                // FIX #5: Robustes Race Parsing
                races.forEach(race => {
                    const totalMin = Science.parseRaceTime(race.time);
                    if (totalMin > 0 && race.distance > 0) {
                        const v = Science.calculateVDOT(race.distance * 1000, totalMin);
                        if (v > bestVDOT) bestVDOT = v;
                    }
                });
                return bestVDOT;
            }, [profile, runs, races]);

            const popRank = useMemo(() => Science.getPopulationPercentile(adaptiveVDOT), [adaptiveVDOT]);
            const cycle = useMemo(() =>
                profile.cycleEnabled && profile.lastPeriod
                    ? Science.getCycleData(profile.lastPeriod, profile.cycleLength)
                    : null,
                [profile.cycleEnabled, profile.lastPeriod, profile.cycleLength]
            );
            const hrZones = useMemo(() => Science.getHrZones(profile.maxHr, profile.restHr), [profile.maxHr, profile.restHr]);

            // Taper-Phase basierend auf Wettkampfdatum
            const taperPhase = useMemo(() => Science.getTaperPhase(profile.raceGoalDate), [profile.raceGoalDate]);

            // Prognosen für alle gängigen Wettkampfdistanzen
            const racePredictions = useMemo(() => {
                if (!profile.assessmentCompleted) return [];
                return [
                    { label: '5 km', dist: 5 },
                    { label: '10 km', dist: 10 },
                    { label: 'Halbmarathon', dist: 21.0975 },
                    { label: 'Marathon', dist: 42.195 },
                ].map(d => ({
                    ...d,
                    time: Science.predictTime(adaptiveVDOT, d.dist),
                    pace: Science.predictTime(adaptiveVDOT, d.dist) / d.dist
                }));
            }, [adaptiveVDOT, profile.assessmentCompleted]);

            const recoveryStatus = useMemo(() => {
                if (runs.length === 0) return { factor: 1.0, message: null };
                const lastRun = runs[0];
                const rpe = parseFloat(lastRun.rpe) || 5;
                const hoursSince = (Date.now() - lastRun.timestamp) / (1000 * 60 * 60);
                if (rpe >= 8 && hoursSince < 36) {
                    return { factor: 0.85, message: `Letzter Lauf sehr anstrengend (RPE ${rpe}). Plan wurde automatisch für optimale Erholung heruntergeregelt.` };
                }
                return { factor: 1.0, message: null };
            }, [runs]);

            const paces = useMemo(() => {
                const base = Science.getPaces(adaptiveVDOT);
                const cycleFactor = cycle ? (cycle.intensity || 1) : 1;
                const taperFactor = taperPhase ? taperPhase.factor : 1.0;
                // Bei Taper nur Volumen reduzieren, nicht Pace (Paces bleiben scharf)
                // totalFactor beeinflusst nur Distanzen im weeklyPlan, nicht die Pace selbst
                const totalFactor = cycleFactor * recoveryStatus.factor;
                return {
                    easy: (parseFloat(base.easy) / totalFactor).toFixed(2),
                    threshold: (parseFloat(base.threshold) / totalFactor).toFixed(2),
                    interval: (parseFloat(base.interval) / totalFactor).toFixed(2),
                    taperFactor // weitergeben für Distanz-Reduktion
                };
            }, [adaptiveVDOT, cycle, recoveryStatus, taperPhase]);

            // FIX #3: getRunExplanation als useCallback damit weeklyPlan nicht unnötig neu berechnet wird
            const getRunExplanation = useCallback((title) => {
                const isSpeed = title.includes('Speed') || title.includes('Interval');
                const isTempo = title.includes('Tempo') || title.includes('Schwellen');
                if (isSpeed) return {
                    goal: "Steigerung der maximalen Sauerstoffaufnahme (VO2max) & neuromuskulären Effizienz.",
                    execution: "Nach 15 Min. lockerem Einlaufen folgen die Intervalle im Z5-Bereich. Dazwischen je 3 Min. Trabpause. Danach 10 Min. Auslaufen.",
                    tip: "Aufrechte Laufhaltung, hohe Schrittfrequenz (ca. 175–185 spm).",
                    hrHint: hrZones ? hrZones.interval : "95–100% MaxHR"
                };
                if (isTempo) return {
                    goal: "Erhöhung der Laktatschwelle (maximale Steady-State-Belastung).",
                    execution: "Kontrollietes Schwellentempo (Z4). Nur noch kurze Sätze möglich. Tief und rhythmisch atmen.",
                    tip: "10 Min. lockeres Ein- und Auslaufen nicht vergessen.",
                    hrHint: hrZones ? hrZones.threshold : "85–90% MaxHR"
                };
                return {
                    goal: "Mitochondrien-Biogenese, Fettstoffwechsel & Stärkung des Bewegungsapparats.",
                    execution: "Absolut ruhiges Tempo (Zone 2). Du kannst dich flüssig unterhalten. Puls stabil im unteren Bereich.",
                    tip: "Lieber zu langsam als zu schnell. Dieser Lauf ist das Fundament.",
                    hrHint: hrZones ? hrZones.easy : "60–75% MaxHR"
                };
            }, [hrZones]);

            const weeklyPlan = useMemo(() => {
                const exp = profile.experience;
                let plan = exp === 'beginner' ? [
                    { day: 'Dienstag', title: 'Speed Intervalle', dist: '6 x 400m', distKm: null, pace: paces.interval, color: 'text-red-600', bg: 'bg-red-50', border: 'border-red-100', icon: 'fa-bolt' },
                    { day: 'Donnerstag', title: 'Tempo Dauerlauf', dist: '5 km', distKm: 5, pace: paces.threshold, color: 'text-orange-600', bg: 'bg-orange-50', border: 'border-orange-100', icon: 'fa-fire' },
                    { day: 'Sonntag', title: 'Lockerer Long Run', dist: '10 km', distKm: 10, pace: paces.easy, color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-100', icon: 'fa-leaf' }
                ] : exp === 'pro' ? [
                    { day: 'Dienstag', title: 'Speed Intervalle', dist: '8 x 1000m', distKm: null, pace: paces.interval, color: 'text-red-600', bg: 'bg-red-50', border: 'border-red-100', icon: 'fa-bolt' },
                    { day: 'Donnerstag', title: 'Tempo Dauerlauf', dist: '12 km', distKm: 12, pace: paces.threshold, color: 'text-orange-600', bg: 'bg-orange-50', border: 'border-orange-100', icon: 'fa-fire' },
                    { day: 'Sonntag', title: 'Lockerer Long Run', dist: '25 km', distKm: 25, pace: paces.easy, color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-100', icon: 'fa-leaf' }
                ] : [
                    { day: 'Dienstag', title: 'Speed Intervalle', dist: '5 x 1000m', distKm: null, pace: paces.interval, color: 'text-red-600', bg: 'bg-red-50', border: 'border-red-100', icon: 'fa-bolt' },
                    { day: 'Donnerstag', title: 'Tempo Dauerlauf', dist: '8 km', distKm: 8, pace: paces.threshold, color: 'text-orange-600', bg: 'bg-orange-50', border: 'border-orange-100', icon: 'fa-fire' },
                    { day: 'Sonntag', title: 'Lockerer Long Run', dist: '18 km', distKm: 18, pace: paces.easy, color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-100', icon: 'fa-leaf' }
                ];

                const needsReduction = (cycle && cycle.intensity < 1.0) || recoveryStatus.factor < 1.0 || (taperPhase && taperPhase.factor < 1.0);
                const distFactor = Math.min(
                    cycle ? cycle.intensity : 1.0,
                    recoveryStatus.factor,
                    taperPhase ? taperPhase.factor : 1.0
                );
                if (needsReduction) {
                    const label = taperPhase && taperPhase.factor < 1.0 ? `Taper-${' '}` : 'Regenerativer ';
                    plan = plan.map(s => ({
                        ...s,
                        title: `${label}${s.title}`,
                        dist: s.distKm != null ? `${(s.distKm * distFactor).toFixed(1)} km` : s.dist,
                        distKm: s.distKm != null ? s.distKm * distFactor : null
                    }));
                }
                return plan.map(item => ({ ...item, science: getRunExplanation(item.title) }));
            }, [profile.experience, paces, cycle, recoveryStatus, taperPhase, getRunExplanation]);

            const currentNextRun = useMemo(() => {
                const idx = nextRunIdx % weeklyPlan.length;
                return { ...weeklyPlan[idx], idx };
            }, [weeklyPlan, nextRunIdx]);

            const upcomingRuns = useMemo(() => {
                const list = [];
                for (let i = 1; i < weeklyPlan.length; i++) {
                    const idx = (nextRunIdx + i) % weeklyPlan.length;
                    list.push({ ...weeklyPlan[idx], idx });
                }
                return list;
            }, [weeklyPlan, nextRunIdx]);

            // --- EVENT HANDLERS ---
            const handleAddRun = useCallback((e) => {
                e.preventDefault();
                const d = parseFloat(e.target.dist.value);
                const t = parseFloat(e.target.dur.value);
                const hr = parseInt(e.target.hr.value) || null;
                const elev = parseInt(e.target.elev.value) || null;
                const rpe = parseInt(e.target.rpe.value) || null;
                if (!Number.isFinite(d) || !Number.isFinite(t) || d <= 0 || t <= 0) {
                    showNotify("Bitte gültige Zahlen eingeben.", "error");
                    return;
                }
                const newRunVDOT = Science.calculateVDOT(d * 1000, t);
                const improved = newRunVDOT > adaptiveVDOT;
                const newRun = { id: safeUUID(), distance: d, duration: t, hr, elev, rpe, timestamp: Date.now(), date: new Date().toLocaleDateString('de-DE') };
                setRuns(prev => [newRun, ...prev]);
                showNotify(improved ? "Fitness-Niveau gesteigert! Plan dynamisch optimiert. 🚀" : "Lauf erfolgreich verbucht und analysiert! 🏃‍♂️");
                e.target.reset();
            }, [adaptiveVDOT, showNotify]);

            const handleQuickLogSubmit = useCallback((e) => {
                e.preventDefault();
                const d = parseFloat(e.target.dist.value);
                const t = parseFloat(e.target.dur.value);
                const hr = parseInt(e.target.hr.value) || null;
                const elev = parseInt(e.target.elev.value) || null;
                const rpe = parseInt(e.target.rpe.value) || null;
                if (!Number.isFinite(d) || !Number.isFinite(t) || d <= 0 || t <= 0) {
                    showNotify("Bitte gültige Daten eingeben.", "error");
                    return;
                }
                const newRunVDOT = Science.calculateVDOT(d * 1000, t);
                const improved = newRunVDOT > adaptiveVDOT;
                const newRun = { id: safeUUID(), distance: d, duration: t, hr, elev, rpe, timestamp: Date.now(), date: new Date().toLocaleDateString('de-DE') };
                setRuns(prev => [newRun, ...prev]);
                setNextRunIdx(prev => prev + 1);
                setQuickLogRun(null);
                showNotify(improved ? "Hervorragend! VDOT verbessert, Plan angepasst! 🚀" : "Lauf erfolgreich abgehakt! 🎯");
            }, [adaptiveVDOT, showNotify]);

            const handleAssessmentSubmit = useCallback((e) => {
                e.preventDefault();
                const minutes = parseFloat(e.target.minutes.value);
                const seconds = parseFloat(e.target.seconds.value) || 0;
                if (!Number.isFinite(minutes) || minutes <= 0) {
                    showNotify("Bitte eine gültige Zeit eingeben.", "error");
                    return;
                }
                const totalMinutes = minutes + seconds / 60;
                const hr = parseInt(e.target.hr.value) || null;
                const rpe = parseInt(e.target.rpe.value) || null;
                setProfile(prev => ({
                    ...prev,
                    assessmentCompleted: true,
                    assessmentDistance: assessmentDist,
                    assessmentTime: totalMinutes.toFixed(2),
                    baseTime: (totalMinutes * (10 / assessmentDist)).toFixed(1)
                }));
                const assessmentRun = {
                    id: safeUUID(), distance: assessmentDist, duration: parseFloat(totalMinutes.toFixed(2)),
                    hr, rpe, elev: 0, timestamp: Date.now(),
                    date: new Date().toLocaleDateString('de-DE'), isAssessment: true
                };
                setRuns(prev => [assessmentRun, ...prev]);
                showNotify("Einstufung abgeschlossen! Dein Plan ist bereit. 🏆");
            }, [assessmentDist, showNotify]);

            const handleAddRace = useCallback((e) => {
                e.preventDefault();
                const name = e.target.raceName.value.trim();
                const dist = parseFloat(e.target.raceDist.value);
                const time = e.target.raceTime.value.trim();
                if (!name || !Number.isFinite(dist) || dist <= 0 || !time) {
                    showNotify("Bitte alle Felder korrekt ausfüllen.", "error");
                    return;
                }
                // FIX #5: Validierung des Zeitformats
                if (Science.parseRaceTime(time) <= 0) {
                    showNotify("Ungültiges Zeitformat. Bitte hh:mm:ss oder mm:ss eingeben.", "error");
                    return;
                }
                setRaces(prev => [{ id: safeUUID(), name, distance: dist, time, date: new Date().toLocaleDateString('de-DE') }, ...prev]);
                showNotify("Referenzzeit hinzugefügt! 🏆");
                e.target.reset();
            }, [showNotify]);

            const deleteItem = useCallback((id, type) => {
                if (type === 'run') setRuns(prev => prev.filter(r => r.id !== id));
                else setRaces(prev => prev.filter(r => r.id !== id));
                showNotify("Eintrag erfolgreich entfernt.");
            }, [showNotify]);

            const exportBackup = useCallback(() => {
                const dataStr = JSON.stringify({ profile, runs, races, nextRunIdx }, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
                const link = document.createElement('a');
                link.setAttribute('href', dataUri);
                link.setAttribute('download', `hm_coach_backup_${new Date().toISOString().slice(0,10)}.json`);
                link.click();
                showNotify("Backup heruntergeladen! 📁");
            }, [profile, runs, races, nextRunIdx, showNotify]);

            const importBackup = useCallback((e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.profile) setProfile({ ...DEFAULT_PROFILE, ...data.profile });
                        if (Array.isArray(data.runs)) setRuns(data.runs);
                        if (Array.isArray(data.races)) setRaces(data.races);
                        if (typeof data.nextRunIdx === 'number') setNextRunIdx(data.nextRunIdx);
                        showNotify("Daten wiederhergestellt! 🔄");
                    } catch {
                        showNotify("Fehler: Ungültiges Backup-Format.", "error");
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            }, [showNotify]);

            const resetData = useCallback(() => {
                if (confirm("Wirklich alle Daten, Einstufungslauf und Fortschritt löschen?")) {
                    ['mc_profile_v31', 'mc_runs_v31', 'mc_races_v31', 'mc_next_run_idx_v31'].forEach(k => storage.remove(k));
                    window.location.reload();
                }
            }, []);

            if (isLoading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-white gap-4">
                    <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">HM-Pro Coach wird geladen…</span>
                </div>
            );

            return (
                <div className="h-screen w-screen flex flex-col bg-slate-50 relative" style={{overflow:'hidden'}}>

                    {/* HEADER */}
                    <header className="flex-none bg-white border-b p-4 z-50 shadow-sm">
                        <div className="max-w-lg mx-auto flex flex-col gap-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                                        <i className="fas fa-chart-line"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-black text-slate-900 leading-none">HM-Pro Coach</h1>
                                        <span className="text-[10px] font-bold text-blue-500 uppercase tracking-widest">
                                            {profile.assessmentCompleted ? `VDOT: ${adaptiveVDOT.toFixed(1)} • v3.1` : "Einstufung ausstehend"}
                                        </span>
                                    </div>
                                </div>
                                {cycle && (
                                    <div className={`px-3 py-1 rounded-full ${cycle.bg} border border-pink-100 flex items-center gap-2`}>
                                        <i className={`fas ${cycle.icon} ${cycle.color} text-[10px]`}></i>
                                        <span className={`text-[10px] font-black uppercase ${cycle.color}`}>{cycle.phase}</span>
                                    </div>
                                )}
                            </div>

                            {/* TAB-NAVIGATION */}
                            <nav className="flex bg-slate-100 p-1 rounded-xl gap-1 overflow-x-auto no-scrollbar">
                                {[
                                    { id: 'plan', label: 'Plan', icon: 'fa-calendar' },
                                    { id: 'track', label: 'Läufe', icon: 'fa-person-running' },
                                    { id: 'races', label: 'Referenz', icon: 'fa-trophy' },
                                    { id: 'profile', label: 'Profil', icon: 'fa-user-gear' }
                                ].map(tab => {
                                    const isDisabled = !profile.assessmentCompleted && tab.id !== 'profile';
                                    return (
                                        <button
                                            key={tab.id}
                                            onClick={() => { if (!isDisabled) { setActiveTab(tab.id); setQuickLogRun(null); }}}
                                            disabled={isDisabled}
                                            className={`flex-1 min-w-[72px] py-2 px-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5
                                                ${isDisabled ? 'opacity-40 cursor-not-allowed text-slate-400' : (activeTab === tab.id ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50')}`}
                                        >
                                            <i className={`fas ${isDisabled ? 'fa-lock' : tab.icon}`}></i>
                                            {tab.label}
                                        </button>
                                    );
                                })}
                            </nav>
                        </div>
                    </header>

                    {/* HAUPTBEREICH */}
                    <main className="flex-1 overflow-y-auto no-scrollbar">
                        <div className="max-w-lg mx-auto p-4 pb-24 space-y-6">

                            {/* ONBOARDING – EINSTUFUNGSLAUF */}
                            {!profile.assessmentCompleted && activeTab !== 'profile' && (
                                <div className="space-y-6 animate-slide">
                                    <div className="glass-card p-6 border-2 border-blue-500 bg-gradient-to-br from-white to-blue-50/20 text-center space-y-4">
                                        <div className="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-md">
                                            <i className="fas fa-flag-checkered"></i>
                                        </div>
                                        <div>
                                            <h2 className="text-xl font-black text-slate-800 leading-tight">Wissenschaftlicher Einstufungslauf</h2>
                                            <p className="text-sm text-slate-500 mt-2">
                                                Bevor dein individueller Plan erstellt werden kann, benötigt die App deinen Ist-Wert. Absolviere einen maximalen Testlauf über 5 km oder 10 km.
                                            </p>
                                        </div>
                                        <div className="bg-slate-100 p-1 rounded-xl flex gap-1">
                                            <button onClick={() => setAssessmentDist(5)} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${assessmentDist === 5 ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500'}`}>
                                                5 km (Empfohlen)
                                            </button>
                                            <button onClick={() => setAssessmentDist(10)} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${assessmentDist === 10 ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500'}`}>
                                                10 km Leistungstest
                                            </button>
                                        </div>
                                        <div className="text-left bg-blue-50 p-4 rounded-xl border border-blue-100/50 space-y-2 text-xs text-slate-700 leading-relaxed">
                                            <span className="font-bold text-blue-800 block text-[10px] uppercase tracking-wider">Ablauf:</span>
                                            <p>1. 10 Min. locker einlaufen + 2–3 Steigerungen.</p>
                                            <p>2. {assessmentDist} km in einem konstanten, maximalen Tempo absolvieren.</p>
                                            <p>3. Exaktes Ergebnis hier eintragen.</p>
                                        </div>
                                        <form onSubmit={handleAssessmentSubmit} className="space-y-4 pt-2 text-left">
                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Minuten*</label>
                                                    <input name="minutes" type="number" min="1" step="1" className="input-field border-blue-200" placeholder="z.B. 24" required />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Sekunden</label>
                                                    <input name="seconds" type="number" min="0" max="59" step="1" className="input-field border-blue-200" placeholder="z.B. 45" />
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Ø Puls (optional)</label>
                                                    <input name="hr" type="number" className="input-field text-sm" placeholder="bpm" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">RPE (1–10)</label>
                                                    <input name="rpe" type="number" min="1" max="10" className="input-field text-sm" placeholder="z.B. 9" />
                                                </div>
                                            </div>
                                            <button type="submit" className="btn-primary w-full py-4 mt-2">
                                                <i className="fas fa-unlock"></i> Einstufung abschließen & Plan aktivieren
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            )}

                            {/* TAB: ADAPTIVER PLAN */}
                            {profile.assessmentCompleted && activeTab === 'plan' && (
                                <div className="space-y-6 animate-slide">

                                    {/* WETTKAMPF-COUNTDOWN BANNER */}
                                    {taperPhase && taperPhase.type !== 'past' && (
                                        <div className={`glass-card p-4 border-l-4 ${taperPhase.type === 'race-week' ? 'border-red-500' : taperPhase.type.startsWith('taper') ? 'border-orange-400' : 'border-blue-400'} ${taperPhase.bg}`}>
                                            <div className="flex items-center justify-between mb-1">
                                                <div className="flex items-center gap-2">
                                                    <i className={`fas ${taperPhase.icon} ${taperPhase.color}`}></i>
                                                    <h4 className="text-xs font-black uppercase text-slate-700">{taperPhase.label}</h4>
                                                    {profile.raceGoalName && <span className="text-[10px] text-slate-400 font-bold">• {profile.raceGoalName}</span>}
                                                </div>
                                                <div className={`text-lg font-black ${taperPhase.color}`}>{taperPhase.daysLeft}T</div>
                                            </div>
                                            <p className="text-xs text-slate-600 leading-snug">{taperPhase.advice}</p>
                                            {taperPhase.factor < 1.0 && (
                                                <div className="mt-2 flex items-center gap-1.5 text-[10px] font-bold text-slate-500">
                                                    <i className="fas fa-arrow-down text-orange-400"></i>
                                                    Trainingsvolumen automatisch auf {Math.round(taperPhase.factor * 100)}% reduziert
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    {taperPhase && taperPhase.type === 'past' && (
                                        <div className="glass-card p-3 bg-slate-50 border border-slate-200 flex items-center justify-between">
                                            <span className="text-xs text-slate-500 font-bold"><i className="fas fa-flag-checkered mr-2 text-slate-400"></i>{profile.raceGoalName || 'Wettkampf'} ist vorbei</span>
                                            <button onClick={() => setProfile(p => ({...p, raceGoalDate: '', raceGoalName: ''}))} className="text-[10px] text-blue-500 font-black">Neues Ziel</button>
                                        </div>
                                    )}

                                    {recoveryStatus.message && (
                                        <div className="glass-card p-4 border-l-4 border-orange-500 bg-orange-50/70">
                                            <div className="flex items-center gap-2 mb-1">
                                                <i className="fas fa-battery-half text-orange-500"></i>
                                                <h4 className="text-xs font-black uppercase text-slate-700">Autoregulation Aktiv</h4>
                                            </div>
                                            <p className="text-sm text-slate-600 leading-tight">{recoveryStatus.message}</p>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-3 gap-3">
                                        <StatCard label="Easy" value={Science.formatPace(paces.easy)} subValue="Grundlage" color="bg-emerald-500" icon="fa-leaf" />
                                        <StatCard label="Tempo" value={Science.formatPace(paces.threshold)} subValue="Schwelle" color="bg-orange-500" icon="fa-fire" />
                                        <StatCard label="Speed" value={Science.formatPace(paces.interval)} subValue="VO2Max" color="bg-red-500" icon="fa-bolt" />
                                    </div>

                                    {/* PROGNOSE-RECHNER */}
                                    <div className="glass-card overflow-hidden">
                                        <button
                                            onClick={() => setShowPredictor(p => !p)}
                                            className="w-full p-4 flex items-center justify-between text-left"
                                        >
                                            <div className="flex items-center gap-3">
                                                <div className="w-9 h-9 rounded-xl bg-violet-100 text-violet-600 flex items-center justify-center">
                                                    <i className="fas fa-stopwatch"></i>
                                                </div>
                                                <div>
                                                    <div className="font-black text-slate-800 text-sm">Wettkampf-Prognose</div>
                                                    <div className="text-[10px] text-slate-400 font-bold uppercase">Zielzeiten auf Basis deines VDOT {adaptiveVDOT.toFixed(1)}</div>
                                                </div>
                                            </div>
                                            <i className={`fas fa-chevron-${showPredictor ? 'up' : 'down'} text-slate-400 text-xs`}></i>
                                        </button>
                                        {showPredictor && (
                                            <div className="px-4 pb-4 space-y-2 animate-slide">
                                                {racePredictions.map(p => (
                                                    <div key={p.label} className="flex items-center justify-between py-2.5 border-t border-slate-100">
                                                        <div>
                                                            <div className="font-black text-slate-800 text-sm">{p.label}</div>
                                                            <div className="text-[10px] text-slate-400 font-bold">{Science.formatPace(p.pace)} min/km</div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="font-black text-violet-600 text-base font-mono">{Science.formatTime(p.time)}</div>
                                                            <div className="text-[9px] text-slate-400 uppercase font-bold">Zielzeit</div>
                                                        </div>
                                                    </div>
                                                ))}
                                                <p className="text-[10px] text-slate-400 pt-1 leading-relaxed italic">
                                                    Prognose basiert auf deinem aktuellen VDOT und der Daniels-Formel. Reale Zeiten variieren je nach Kurs, Wetter und Tagesform.
                                                </p>
                                            </div>
                                        )}
                                    </div>

                                    {/* NÄCHSTER LAUF */}
                                    <div className="glass-card p-5 border-2 border-blue-500 shadow-md relative overflow-hidden bg-gradient-to-br from-white to-blue-50/30">
                                        <div className="absolute top-0 right-0 bg-blue-600 text-white px-3 py-1 rounded-bl-xl text-[10px] font-black uppercase tracking-wider">
                                            Dein nächster Lauf
                                        </div>
                                        <div className="flex items-start gap-3 mt-2 mb-4">
                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-lg ${currentNextRun.bg} ${currentNextRun.color} shadow-sm border ${currentNextRun.border}`}>
                                                <i className={`fas ${currentNextRun.icon}`}></i>
                                            </div>
                                            <div>
                                                <span className="text-xs font-bold text-blue-600">{currentNextRun.day}</span>
                                                <h3 className="text-lg font-black text-slate-800 leading-tight">{currentNextRun.title}</h3>
                                                <p className="text-sm font-bold text-slate-500 mt-0.5">{currentNextRun.dist} @ <span className="text-slate-800 font-black">{Science.formatPace(currentNextRun.pace)} min/km</span></p>
                                            </div>
                                        </div>
                                        <div className="border-t border-slate-100 pt-3 space-y-3 text-xs text-slate-600">
                                            <div>
                                                <h4 className="font-bold text-slate-700 flex items-center gap-1.5"><i className="fas fa-circle-info text-blue-500"></i> Trainingsziel:</h4>
                                                <p className="mt-0.5 leading-relaxed">{currentNextRun.science.goal}</p>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-slate-700 flex items-center gap-1.5"><i className="fas fa-person-running text-blue-500"></i> Durchführung:</h4>
                                                <p className="mt-0.5 leading-relaxed">{currentNextRun.science.execution}</p>
                                            </div>
                                            {currentNextRun.science.hrHint && (
                                                <div className="flex items-center gap-2 text-[11px] text-slate-500 bg-slate-50 p-2 rounded-lg">
                                                    <i className="fas fa-heart text-red-400"></i>
                                                    <span><strong>Herzfrequenz-Ziel:</strong> {currentNextRun.science.hrHint}</span>
                                                </div>
                                            )}
                                            <div className="bg-blue-50/50 p-2.5 rounded-lg border border-blue-100/50">
                                                <span className="font-bold text-blue-800 block text-[10px] uppercase tracking-wider mb-0.5">Sportwissenschaftlicher Tipp:</span>
                                                <p className="italic leading-relaxed text-slate-700">{currentNextRun.science.tip}</p>
                                            </div>
                                        </div>
                                        <div className="mt-4 pt-1">
                                            {quickLogRun?.idx === currentNextRun.idx ? (
                                                <form onSubmit={handleQuickLogSubmit} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3 mt-2 animate-slide">
                                                    <h4 className="text-xs font-black text-slate-700 uppercase tracking-wider mb-1">Reale Laufdaten:</h4>
                                                    <div className="grid grid-cols-2 gap-2">
                                                        <div>
                                                            <label className="text-[9px] font-bold text-slate-400 uppercase">Distanz (km)</label>
                                                            <input name="dist" type="number" step="0.01" defaultValue={currentNextRun.distKm || ""} className="input-field py-1.5 px-2 text-sm" required />
                                                        </div>
                                                        <div>
                                                            <label className="text-[9px] font-bold text-slate-400 uppercase">Zeit (Minuten)</label>
                                                            <input name="dur" type="number" step="0.01" className="input-field py-1.5 px-2 text-sm" placeholder="z.B. 45" required />
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-3 gap-2">
                                                        <div>
                                                            <label className="text-[9px] font-bold text-slate-400 uppercase">Ø Puls</label>
                                                            <input name="hr" type="number" className="input-field py-1.5 px-2 text-sm" placeholder="bpm" />
                                                        </div>
                                                        <div>
                                                            <label className="text-[9px] font-bold text-slate-400 uppercase">Höhenmeter</label>
                                                            <input name="elev" type="number" className="input-field py-1.5 px-2 text-sm" placeholder="Hm" />
                                                        </div>
                                                        <div>
                                                            <label className="text-[9px] font-bold text-slate-400 uppercase">RPE (1–10)</label>
                                                            <input name="rpe" type="number" min="1" max="10" className="input-field py-1.5 px-2 text-sm" placeholder="Gefühl" />
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-2 pt-2">
                                                        <button type="submit" className="btn-primary py-2 text-xs flex-1">Speichern & Abhaken</button>
                                                        <button type="button" onClick={() => setQuickLogRun(null)} className="btn-secondary py-2 text-xs w-24">Abbrechen</button>
                                                    </div>
                                                </form>
                                            ) : (
                                                <button onClick={() => setQuickLogRun({ idx: currentNextRun.idx })} className="btn-primary w-full py-3 text-sm mt-1">
                                                    <i className="fas fa-check-double"></i> Als absolviert markieren & eintragen
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* KOMMENDE LÄUFE */}
                                    <div className="space-y-3">
                                        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Kommende Läufe</h4>
                                        <div className="grid grid-cols-1 gap-2">
                                            {upcomingRuns.map((s, idx) => (
                                                <div key={idx} className="glass-card p-3.5 bg-slate-50/40 border border-slate-200/50 flex justify-between items-center">
                                                    <div className="flex gap-3 items-center">
                                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center font-black text-xs ${s.bg} ${s.color}`}>
                                                            <i className={`fas ${s.icon} text-xs`}></i>
                                                        </div>
                                                        <div>
                                                            <div className="text-[10px] font-semibold text-slate-400 uppercase leading-none">{s.day}</div>
                                                            <div className="font-bold text-slate-700 text-sm mt-0.5">{s.title}</div>
                                                            <div className="text-[11px] text-slate-500">{s.dist}</div>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-xs font-black text-slate-600">{Science.formatPace(s.pace)} min/km</div>
                                                        <span className="text-[8px] text-slate-400 uppercase font-bold tracking-wider">Ziel-Pace</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: LÄUFE */}
                            {profile.assessmentCompleted && activeTab === 'track' && (
                                <div className="space-y-6 animate-slide">
                                    <div className="glass-card p-5">
                                        <h3 className="font-black text-slate-800 mb-4 flex items-center gap-2"><i className="fas fa-plus-circle text-blue-600"></i> Freies Training eintragen</h3>
                                        <form onSubmit={handleAddRun} className="space-y-4">
                                            <div className="grid grid-cols-2 gap-3 border-b pb-4">
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Distanz (km)*</label>
                                                    <input name="dist" type="number" step="0.01" className="input-field" placeholder="z.B. 12.4" required />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Zeit (Minuten)*</label>
                                                    <input name="dur" type="number" step="0.01" className="input-field" placeholder="z.B. 62" required />
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-3 gap-3">
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Ø Puls</label>
                                                    <input name="hr" type="number" className="input-field text-sm" placeholder="bpm" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Höhenmeter</label>
                                                    <input name="elev" type="number" className="input-field text-sm" placeholder="m" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">RPE (1–10)</label>
                                                    <input name="rpe" type="number" min="1" max="10" className="input-field text-sm" placeholder="Gefühl" />
                                                </div>
                                            </div>
                                            <button type="submit" className="btn-primary text-base py-3.5 mt-1">Lauf eintragen & VDOT updaten</button>
                                        </form>
                                    </div>
                                    <div className="space-y-2">
                                        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Absolvierte Läufe</h4>
                                        {runs.length === 0 && <p className="text-xs text-slate-400 p-4 italic text-center">Noch keine Läufe erfasst.</p>}
                                        {runs.map(r => (
                                            <div key={r.id} className="glass-card p-4 flex justify-between items-center">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs ${r.isAssessment ? 'bg-blue-100 text-blue-600' : (r.rpe >= 8 ? 'bg-red-100 text-red-500' : 'bg-slate-100 text-slate-400')}`}>
                                                        <i className={`fas ${r.isAssessment ? 'fa-flag-checkered' : 'fa-person-running'}`}></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-[10px] font-bold text-slate-400 uppercase">{r.date}{r.isAssessment ? " • Einstufungslauf" : ""}</div>
                                                        <div className="text-sm font-black text-slate-800">{r.distance} km in {r.duration} min</div>
                                                        <div className="text-[10px] text-slate-500 mt-0.5 flex gap-2 flex-wrap">
                                                            {r.hr && <span><i className="fas fa-heart text-red-400 mr-1"></i>{r.hr} bpm</span>}
                                                            {r.elev ? <span><i className="fas fa-mountain text-slate-400 mr-1"></i>{r.elev}m</span> : null}
                                                            {r.rpe && <span><i className="fas fa-battery-half text-orange-400 mr-1"></i>RPE {r.rpe}</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3 flex-none">
                                                    <div className="text-xs font-mono font-bold text-blue-600">{Science.formatPace(r.duration / r.distance)}</div>
                                                    <button onClick={() => deleteItem(r.id, 'run')} className="text-slate-300 hover:text-red-500 transition-colors p-2"><i className="fas fa-trash-can"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB: REFERENZ */}
                            {profile.assessmentCompleted && activeTab === 'races' && (
                                <div className="space-y-6 animate-slide">
                                    <div className="glass-card p-5">
                                        <h3 className="font-black text-slate-800 mb-4 flex items-center gap-2"><i className="fas fa-award text-yellow-500"></i> Wettkampf-Referenzwert</h3>
                                        <p className="text-xs text-slate-500 mb-4">Ein offizieller Wettkampf liefert die präziseste Einstufung deines VDOT-Wertes.</p>
                                        <form onSubmit={handleAddRace} className="space-y-3">
                                            <input name="raceName" type="text" className="input-field" placeholder="Veranstaltungsname (z.B. Frankfurt Marathon)" required />
                                            <div className="grid grid-cols-2 gap-3">
                                                <input name="raceDist" type="number" step="0.1" className="input-field" placeholder="Distanz (km)" required />
                                                <input name="raceTime" type="text" className="input-field" placeholder="hh:mm:ss oder mm:ss" required />
                                            </div>
                                            <button type="submit" className="btn-primary">Referenz hinzufügen</button>
                                        </form>
                                    </div>
                                    <div className="space-y-2">
                                        {races.length === 0 && <p className="text-xs text-slate-400 p-4 italic text-center">Noch keine Wettkämpfe erfasst.</p>}
                                        {races.map(r => (
                                            <div key={r.id} className="glass-card p-4 flex justify-between items-center">
                                                <div className="flex gap-4 items-center">
                                                    <div className="w-8 h-8 rounded-full bg-yellow-50 text-yellow-600 flex items-center justify-center"><i className="fas fa-medal text-sm"></i></div>
                                                    <div>
                                                        <div className="font-black text-slate-800 text-sm">{r.name}</div>
                                                        <div className="text-[10px] text-slate-400 font-bold uppercase">{r.distance} km in {r.time} • {r.date}</div>
                                                    </div>
                                                </div>
                                                <button onClick={() => deleteItem(r.id, 'race')} className="text-slate-300 hover:text-red-500 p-2"><i className="fas fa-trash-can"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB: PROFIL */}
                            {activeTab === 'profile' && (
                                <div className="space-y-6 animate-slide">

                                    {/* Leistungs-Benchmark */}
                                    {profile.assessmentCompleted && (
                                        <div className="glass-card p-5 border-blue-100 bg-gradient-to-b from-blue-50/50 to-white">
                                            <h3 className="font-black text-slate-800 mb-4 flex items-center gap-2"><i className="fas fa-chart-line text-blue-500"></i> Leistungs-Benchmark</h3>
                                            <div className="text-center mb-4">
                                                <div className={`text-xl font-black ${popRank.color}`}>{popRank.text}</div>
                                                <p className="text-xs text-slate-500 mt-1">Gegenüberstellung deines VDOT-Werts mit ambitionierten Amateurläufern.</p>
                                            </div>
                                            <div className="w-full bg-slate-200 rounded-full h-2 mb-1 overflow-hidden">
                                                <div className={`h-2 rounded-full progress-bar bg-current ${popRank.color}`} style={{width: `${popRank.percent}%`}}></div>
                                            </div>
                                            <div className="flex justify-between text-[8px] text-slate-400 font-bold uppercase">
                                                <span>Basis</span>
                                                <span>Top 1%</span>
                                            </div>
                                        </div>
                                    )}

                                    {/* Basiskonfiguration */}
                                    <div className="glass-card p-5">
                                        <h3 className="font-black text-slate-800 mb-4 flex items-center gap-2"><i className="fas fa-sliders text-blue-500"></i> Trainings-Konfiguration</h3>
                                        <div className="space-y-4">
                                            {profile.assessmentCompleted && (
                                                <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center text-xs">
                                                    <span className="font-semibold text-slate-600">Einstufungslauf:</span>
                                                    <span className="font-mono font-bold text-blue-600">{profile.assessmentDistance} km in {Science.formatPace(parseFloat(profile.assessmentTime))} min</span>
                                                </div>
                                            )}
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Erfahrungsstufe</label>
                                                <select value={profile.experience} onChange={e => setProfile(p => ({...p, experience: e.target.value}))} className="input-field">
                                                    <option value="beginner">Anfänger (Einstieg & moderate Umfänge)</option>
                                                    <option value="intermediate">Fortgeschritten (3 Einheiten/Woche)</option>
                                                    <option value="pro">Leistungssport (Sehr ambitionierte Umfänge)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Zyklus-Steuerung */}
                                    <div className="glass-card p-5 border-pink-100 bg-pink-50/20">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="font-black text-slate-800 flex items-center gap-2"><i className="fas fa-venus text-pink-500"></i> Hormonelle Zyklus-Steuerung</h3>
                                            <input type="checkbox" checked={profile.cycleEnabled} onChange={e => setProfile(p => ({...p, cycleEnabled: e.target.checked}))} className="w-5 h-5 accent-pink-500" />
                                        </div>
                                        {profile.cycleEnabled && (
                                            <div className="grid grid-cols-2 gap-3 animate-slide">
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Erster Tag der Periode</label>
                                                    <input type="date" value={profile.lastPeriod} onChange={e => setProfile(p => ({...p, lastPeriod: e.target.value}))} className="input-field text-sm" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Zykluslänge (Tage)</label>
                                                    <input type="number" value={profile.cycleLength} min="21" max="45" onChange={e => setProfile(p => ({...p, cycleLength: parseInt(e.target.value) || 28}))} className="input-field text-sm" />
                                                </div>
                                            </div>
                                        )}
                                        {cycle && (
                                            <div className={`mt-3 p-3 rounded-xl ${cycle.bg} border border-pink-100/50 text-xs`}>
                                                <span className={`font-black ${cycle.color}`}><i className={`fas ${cycle.icon} mr-1`}></i>{cycle.phase}</span>
                                                <span className="text-slate-500 ml-2">{cycle.advice}</span>
                                            </div>
                                        )}
                                    </div>

                                    {/* Biometrie */}
                                    <div className="glass-card p-5">
                                        <h3 className="font-black text-slate-800 mb-4 flex items-center gap-2"><i className="fas fa-heart-pulse text-red-500"></i> Biometrie & HF-Zonen</h3>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Alter</label>
                                                <input type="number" value={profile.age} onChange={e => setProfile(p => ({...p, age: e.target.value}))} className="input-field" placeholder="z.B. 34" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Gewicht (kg)</label>
                                                <input type="number" value={profile.weight} onChange={e => setProfile(p => ({...p, weight: e.target.value}))} className="input-field" placeholder="z.B. 75" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Max. Herzfrequenz</label>
                                                <input type="number" value={profile.maxHr} onChange={e => setProfile(p => ({...p, maxHr: e.target.value}))} className="input-field" placeholder="z.B. 190" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Ruheherzfrequenz</label>
                                                <input type="number" value={profile.restHr} onChange={e => setProfile(p => ({...p, restHr: e.target.value}))} className="input-field" placeholder="z.B. 52" />
                                            </div>
                                        </div>
                                        {hrZones && (
                                            <div className="mt-4 space-y-2 border-t pt-4">
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Deine HF-Zonen (Karvonen)</span>
                                                <div className="grid grid-cols-3 gap-2 mt-2">
                                                    {[
                                                        { label: 'Easy (Z2)', value: hrZones.easy, color: 'text-emerald-600 bg-emerald-50' },
                                                        { label: 'Schwelle (Z4)', value: hrZones.threshold, color: 'text-orange-600 bg-orange-50' },
                                                        { label: 'VO2Max (Z5)', value: hrZones.interval, color: 'text-red-600 bg-red-50' }
                                                    ].map(z => (
                                                        <div key={z.label} className={`rounded-xl p-2 text-center ${z.color}`}>
                                                            <div className="text-[9px] font-black uppercase">{z.label}</div>
                                                            <div className="text-[11px] font-black mt-0.5">{z.value}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Zielwettkampf */}
