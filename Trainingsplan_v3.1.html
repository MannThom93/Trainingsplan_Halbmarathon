                                    <div className="glass-card p-5 border-violet-100 bg-violet-50/20">
                                        <h3 className="font-black text-slate-800 mb-1 flex items-center gap-2"><i className="fas fa-bullseye text-violet-500"></i> Zielwettkampf & Countdown</h3>
                                        <p className="text-xs text-slate-500 mb-4">Der Plan passt Taper und Volumen automatisch an deinen Wettkampftag an.</p>
                                        <div className="space-y-3">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Name des Wettkampfs</label>
                                                <input type="text" value={profile.raceGoalName} onChange={e => setProfile(p => ({...p, raceGoalName: e.target.value}))} className="input-field" placeholder="z.B. Berlin Marathon 2026" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Datum</label>
                                                    <input type="date" value={profile.raceGoalDate} onChange={e => setProfile(p => ({...p, raceGoalDate: e.target.value}))} className="input-field text-sm" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Distanz (km)</label>
                                                    <select value={profile.raceGoalDist} onChange={e => setProfile(p => ({...p, raceGoalDist: parseFloat(e.target.value)}))} className="input-field text-sm">
                                                        <option value={5}>5 km</option>
                                                        <option value={10}>10 km</option>
                                                        <option value={21.0975}>Halbmarathon</option>
                                                        <option value={42.195}>Marathon</option>
                                                    </select>
                                                </div>
                                            </div>
                                            {taperPhase && taperPhase.type !== 'past' && profile.raceGoalDate && (
                                                <div className={`p-3 rounded-xl ${taperPhase.bg} flex items-center gap-3`}>
                                                    <i className={`fas ${taperPhase.icon} ${taperPhase.color} text-lg`}></i>
                                                    <div>
                                                        <div className={`font-black text-sm ${taperPhase.color}`}>{taperPhase.daysLeft} Tage • {taperPhase.label}</div>
                                                        <div className="text-[10px] text-slate-500">{taperPhase.advice}</div>
                                                    </div>
                                                </div>
                                            )}
                                            {profile.assessmentCompleted && profile.raceGoalDist && (
                                                <div className="p-3 bg-violet-50 rounded-xl border border-violet-100 flex items-center justify-between">
                                                    <span className="text-xs font-bold text-slate-600">Aktuelle Prognose für {profile.raceGoalDist === 21.0975 ? 'Halbmarathon' : profile.raceGoalDist === 42.195 ? 'Marathon' : `${profile.raceGoalDist} km`}:</span>
                                                    <span className="font-black text-violet-600 font-mono text-sm">{Science.formatTime(Science.predictTime(adaptiveVDOT, parseFloat(profile.raceGoalDist)))}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Backup */}
                                    <div className="glass-card p-5">
                                        <h3 className="font-black text-slate-800 mb-4 flex items-center gap-2"><i className="fas fa-hard-drive text-slate-500"></i> Lokales Dateibackup</h3>
                                        <p className="text-xs text-slate-500 mb-4">Sichere deinen Trainingsfortschritt als Offline-Backup-Datei.</p>
                                        <div className="space-y-3">
                                            <button onClick={exportBackup} className="btn-secondary">
                                                <i className="fas fa-file-export"></i> Backup exportieren
                                            </button>
                                            <div className="relative">
                                                <input type="file" accept=".json" onChange={importBackup} ref={fileInputRef} className="hidden" id="backup-upload" />
                                                <label htmlFor="backup-upload" className="btn-secondary cursor-pointer border-dashed border-2 border-slate-300" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',padding:'0.75rem 1.25rem',borderRadius:'0.75rem',fontWeight:600,width:'100%',background:'white',color:'#1e293b',boxSizing:'border-box'}}>
                                                    <i className="fas fa-file-import"></i> Backup einspielen
                                                </label>
                                            </div>
                                        </div>
                                        <div className="pt-6 mt-4 border-t border-slate-100">
                                            <button onClick={resetData} className="w-full text-red-500 text-[10px] font-black uppercase tracking-widest p-2 hover:bg-red-50 rounded-lg transition-all flex items-center justify-center">
                                                <i className="fas fa-triangle-exclamation mr-2"></i>Werkseinstellungen wiederherstellen
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* FOOTER */}
                    <div className="fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur-md border-t flex justify-center items-center pointer-events-none z-40">
                        <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">HM-Pro Coach v3.1 • Autoregulation + Smart Plan</span>
                    </div>

                    <Notification {...notification} onClose={() => setNotification(null)} />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
